<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store — PeakSMP.net</title>
  <meta name="description" content="Buy ranks, keys, crates and more for PeakSMP.net — the competitive Minecraft LifeSteal SMP server." />
  <meta property="og:title" content="Store — PeakSMP.net" />
  <meta property="og:image" content="https://www.peaksmp.net/assets/logo.png" />
  <meta property="og:url" content="https://www.peaksmp.net/store" />
  <link rel="canonical" href="https://www.peaksmp.net/store" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- Redirect to the actual store after a brief moment -->
  <meta http-equiv="refresh" content="0;url=https://store.peaksmp.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #111111;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .wrap { padding: 40px 20px; }
    .logo {
      width: 80px;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 20px rgba(95,201,243,0.6));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #5fc9f3, #5fc9f3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    p { color: #c3d4dc; font-size: 0.9rem; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #5fc9f3;
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }
    a:hover { background: #5fc9f3; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/assets/logo.png" alt="PeakSMP Logo" />
    <h1>PeakSMP Store</h1>
    <p>Redirecting you to our store...</p>
    <a href="https://store.peaksmp.net">Go to Store →</a>
  </div>
  <script>window.location.replace("https://store.peaksmp.net");</script>
</body>
</html>
